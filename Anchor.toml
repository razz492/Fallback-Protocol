[toolchain]

[features]
resolution = true
skip-lint = false

# Change this from localnet to devnet
[programs.devnet]
fallback_protocol = "Fa11back11111111111111111111111111111111111" 
# (Replace this address with your real generated Program ID! You can find it by running 'solana address -k target/deploy/fallback_protocol-keypair.json')

[registry]
url = "https://api.apr.dev"

[provider]
# Change cluster from "Localnet" to "Devnet"
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p tsconfig.json -t 1000000 tests/**/*.ts"